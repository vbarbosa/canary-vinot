{% extends "base.html" %}
{% block title %}Entrar · {{ site.serverName }}{% endblock %}
{% block main %}
<section class="wrap section auth">
  <form method="post" action="/entrar" class="card pad form">
    <div class="center-text"><img src="/static/px/key.svg" alt="" class="px s64"><h1>Entrar</h1></div>
    {% include "_flash.html" %}
    {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail <input type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus></label>
    <label>Senha <input type="password" name="senha" required autocomplete="current-password"></label>
    <button class="btn big block" type="submit">Entrar</button>
    <p class="row between small"><a href="/esqueci">Esqueci a senha</a><a href="/criar-conta">Criar conta</a></p>
  </form>
</section>
{% endblock %}
