{% if rows %}
<ul class="who-found">
  {% for r in rows %}
  <li><button type="button" class="outline small" onclick="const f=this.closest('form'); f.x.value={{ r.posx }}; f.y.value={{ r.posy }}; f.z.value={{ r.posz }}">
    <span class="dot {{ 'on' if r.online }}"></span> {{ r.name }} <span class="muted">({{ r.posx }}, {{ r.posy }}, {{ r.posz }})</span></button></li>
  {% endfor %}
</ul>
{% elif busca|length >= 2 %}<p class="muted small">Ninguém com “{{ busca }}”.</p>{% endif %}
