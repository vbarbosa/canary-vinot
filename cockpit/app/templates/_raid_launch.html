<article>
  <header>
    <button aria-label="Fechar" rel="prev" type="button" onclick="this.closest('dialog').close()"></button>
    <h4>👹 Lançar invasão</h4>
  </header>
  <p><strong>{{ r.label }}</strong> <span class="muted">· {{ r.where }}</span><br>
    <span class="mono muted small">x {{ r.x }}, y {{ r.y }}, z {{ r.z }}</span>
    {% if r.monsters %}<br><span class="muted small">{{ r.monsters|map('title')|join(', ') }}</span>{% endif %}</p>
  <form hx-post="/raids/lancar" hx-target="#toast" hx-on::after-request="if(event.detail.successful) this.closest('dialog').close()">
    <input type="hidden" name="nome" value="{{ r.name }}">
    <details>
      <summary class="small">Teleportar jogadores junto (opcional)</summary>
      <div class="row wrap small" style="margin-top:.4rem">
        <button type="button" class="outline small" data-pick="all">Online</button>
        <button type="button" class="outline small" data-pick="group">A turma</button>
        <button type="button" class="outline small" data-pick="none">Ninguém</button>
      </div>
      <input type="search" name="busca" placeholder="Buscar qualquer personagem…" autocomplete="off" class="who-search"
             hx-get="/teleporte/quem" hx-trigger="input changed delay:250ms" hx-target="#who-found">
      <div id="who-found"></div>
      <ul class="pick-list">
        {% for o in who %}{% include "_who_item.html" %}{% endfor %}
      </ul>
    </details>
    <div class="row" style="margin-top:.6rem">
      <button type="submit">👹 Lançar invasão</button>
      <button type="button" class="outline secondary" onclick="this.closest('dialog').close()">Cancelar</button>
    </div>
  </form>
</article>
