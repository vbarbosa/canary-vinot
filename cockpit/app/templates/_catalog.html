{% for it in items %}<div class="item" data-id="{{ it.id }}" title="{{ it.name }} ({{ it.id }})"><img src="/icone/{{ it.id }}.png" alt="" loading="lazy"><span>{{ it.name }}</span><button type="button" class="send" data-id="{{ it.id }}" title="Enviar {{ it.name }}">➤</button></div>{% else %}<p class="muted">Nenhum item.</p>{% endfor %}
