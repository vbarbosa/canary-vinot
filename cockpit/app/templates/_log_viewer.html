<header class="row wrap">
  <div><strong>{{ sel.arquivo }}</strong><br><small class="muted">{{ sel.pasta }} · {{ hb(sel.size) }} · modificado <span data-ts="{{ sel.mtime }}"></span></small></div>
  <a role="button" class="outline small right" href="/logs/baixar?pasta={{ sel.pasta|urlencode }}&arquivo={{ sel.arquivo|urlencode }}">Baixar</a>
</header>
<form class="row log-tools" hx-get="/logs/ver" hx-target="#lines"
      hx-trigger="submit, change from:select, input changed delay:400ms from:input[name=filtro]{% if sel.active %}, every 5s [document.getElementById('live').checked]{% endif %}">
  <input type="hidden" name="pasta" value="{{ sel.pasta }}"><input type="hidden" name="arquivo" value="{{ sel.arquivo }}">
  <input type="search" name="filtro" value="{{ filtro }}" placeholder="Filtrar (ex.: error, nome do jogador)…">
  <select name="linhas">{% for n in [200, 500, 1000, 2000] %}<option value="{{ n }}" {{ 'selected' if n == linhas }}>últimas {{ n }}</option>{% endfor %}</select>
  {% if sel.active %}<label><input type="checkbox" id="live" role="switch" checked> Ao vivo</label>{% endif %}
</form>
<div id="lines">{% include "_log_lines.html" %}</div>
