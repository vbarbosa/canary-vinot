name: otbr
services:
  database:
    image: mariadb:latest
    restart: unless-stopped
    env_file:
      - '.env'
    networks:
      - canary-net
    ports:
      - '$MYSQL_PORT:3306'
    volumes:
      - 'db-volume:/var/lib/mysql'
      - ../schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10


  server:
    # cpuset: "0-4"
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: prod
    restart: unless-stopped
    env_file:
      - '.env'
    networks:
      - canary-net
    ports:
      - '$gameProtocolPort:$gameProtocolPort'
      - '$statusProtocolPort:$statusProtocolPort'
    volumes:
      - '../:/srv/canary'
    depends_on:
      database:
        condition: service_healthy

  login:
    image: opentibiabr/login-server:latest
    restart: unless-stopped
    ports:
      - '$LOGIN_HTTP_PORT:$LOGIN_HTTP_PORT'
      - '$LOGIN_GRPC_PORT:$LOGIN_GRPC_PORT'
    env_file:
      - '.env'
    networks:
      - canary-net
    depends_on:
      database:
        condition: service_healthy

  # Public site (landing, news, player accounts). See portal/README.md.
  portal:
    build:
      context: ../portal
    restart: unless-stopped
    env_file:
      - '.env'
      # SMTP key, PORTAL_SECRET, Sanity project id; kept out of git.
      - path: 'portal.env'
        required: false
    environment:
      MYSQL_HOST: database
      PORTAL_GAME_HOST: server
      PORTAL_GAME_DATA: /gamedata
    networks:
      - canary-net
    ports:
      # Only on localhost: the internet reaches it through Cloudflare Tunnel, never directly.
      - '${PORTAL_BIND:-127.0.0.1}:8091:8091'
    volumes:
      # Client releases for /baixar: one folder per version (see portal/app/downloads.py).
      - '${PORTAL_DOWNLOADS_DIR:-./downloads}:/downloads:ro'
      # Monster/item files for the Wiki (see portal/app/wiki.py); read-only, same source the game uses.
      - '../data:/gamedata/data:ro'
      - '../data-otservbr-global:/gamedata/data-otservbr-global:ro'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy

volumes:
  db-volume:

networks:
  canary-net:
    driver: bridge
